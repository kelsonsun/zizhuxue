<body><main id="offlineMsg"><h1>📶 现在没有网络</h1>
<p>你在「我的 → 离线使用」里关掉了离线使用，所以「自主学」每次都从网上加载最新版，没网时打不开。</p>
<p class="m">你的材料、生词卡和复习记录都还在这台设备上，没有丢。</p>
<p class="m">联网后点「重试」。想断网也能用：联网打开后，到「我的 → 离线使用」打开开关。</p>
<button onclick="location.reload()">重试</button></main></body></html>
